# 自動把網站發佈到 GitHub Pages。
# 每次推送到預設分支，就會執行 python build.py，再把 _site/ 發佈出去。
# 第一次使用前，請到 GitHub 儲存庫的 Settings → Pages，把 Source 設成「GitHub Actions」。
name: 發佈網站到 GitHub Pages

on:
  push:
    branches: [claude/ecstatic-knuth-ildmh4, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 產生網站
        run: python build.py --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
