<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}文稿工作室{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="icon" href="/static/img/characters/nuo-thinking.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f3f1ea; --panel: #fffdf8; --ink: #2f2925; --soft: #6b6157; --rule: #d9d2c4;
    --accent: #2f5fa7; --draft: #d98a1c; --review: #8a5cc4; --final: #2e8b57; --bad: #c0392b;
    --font-display: "LXGW WenKai TC", "Kaiti TC", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
  header.bar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  header.bar a.home { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
  header.bar .spacer { flex: 1; }
  h1, h2, h3 { font-family: var(--font-display); line-height: 1.3; }
  a { color: var(--accent); }
  .btn { font: inherit; font-size: .9rem; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 4px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: #ffe58a; }
  .btn.primary { background: var(--ink); color: var(--panel); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
  .pill { font-size: .78rem; padding: 1px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .pill.draft { background: var(--draft); } .pill.review { background: var(--review); } .pill.final { background: var(--final); }
  .msg { font-size: .9rem; color: var(--soft); }
  .msg.bad { color: var(--bad); }
  :focus-visible { outline: 3px solid #d98a1c; outline-offset: 2px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="bar">
  <a class="home" href="/"><img src="/static/img/characters/nuo-thinking.svg" alt="" width="34" height="37">文稿工作室</a>
  {% block bar %}{% endblock %}
  <span class="spacer"></span>
  <a class="btn" href="/candidates">經典獎項候選清單</a>
  <a class="btn" href="/site/index.html" target="_blank">看網站 ↗</a>
</header>
{% block main %}{% endblock %}
</body>
</html>
